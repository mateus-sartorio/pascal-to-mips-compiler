<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 430" width="1500" height="430" role="img" aria-labelledby="title desc">
  <title id="title">Compiler pipeline: source code to MIPS</title>
  <desc id="desc">Source code enters the compiler. The front-end runs the lexical analyzer (scanner), the syntax analyzer (parser), the semantic analyzer and the AST builder, which produces the intermediate representation. The back-end runs the code generator, which emits the target MIPS assembly.</desc>

  <style>
    .t { font-family: "Trebuchet MS", "Segoe UI", Arial, sans-serif; }
    .io      { font-size: 21px; font-weight: bold; fill: #1f4e79; }
    .frame   { font-size: 18px; font-weight: bold; fill: #1f4e79; letter-spacing: 0.5px; }
    .side    { font-size: 18px; font-weight: bold; font-style: italic; fill: #1f4e79; }
    .step    { font-size: 17px; font-weight: bold; fill: #10233a; }
    .sub     { font-size: 13px; font-style: italic; fill: #2f5d8a; }
    .edge    { font-size: 13px; fill: #38618d; }
    .ir      { font-size: 15px; font-weight: bold; fill: #1f4e79; letter-spacing: 1px; }
    .box     { fill: #c5dcf0; stroke: #86b0d8; stroke-width: 2; }
    .group   { fill: #e6f0fa; stroke: #9dc0e2; stroke-width: 2; stroke-dasharray: 9 6; }
    .flow    { stroke: #1f4e79; stroke-width: 6; fill: none; marker-end: url(#head); }
  </style>

  <defs>
    <!-- refX=0 anchors the head's base (not its tip) to the end of the path, so the thick
         stroke stops where the triangle starts instead of poking out past its converging
         edges and blunting the point. Every flow path therefore ends 16px short of the
         point it aims at. -->
    <marker id="head" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="16"
            refX="0" refY="8" orient="auto">
      <path d="M0,0 L16,8 L0,16 Z" fill="#1f4e79" />
    </marker>
  </defs>

  <rect width="1500" height="430" fill="#ffffff" />

  <!-- Source code, entering the front-end from the top -->
  <g transform="translate(142.3, 40)">
    <g stroke="#1f4e79" stroke-width="2" fill="#ffffff">
      <path d="M-92,-20 h14 l7,7 v19 h-21 z" stroke-linejoin="round" />
      <path d="M-87,-9 h11 M-87,-4 h11 M-87,1 h7" stroke-width="1.6" />
    </g>
    <text class="t io" x="-62" y="6">Source code (Pascal)</text>
  </g>

  <!-- Target code, leaving the back-end at the top -->
  <g transform="translate(1290.7, 40)">
    <rect x="-92" y="-20" width="21" height="26" rx="3" fill="#1f4e79" />
    <path d="M-87,-13 h11 M-87,-7 h11 M-87,-1 h11" stroke="#ffffff" stroke-width="1.6" />
    <text class="t io" x="-62" y="6">Target code (MIPS)</text>
  </g>

  <!-- Compiler -->
  <rect x="40" y="110" width="1420" height="285" rx="24" fill="#f2f4f6" stroke="#dbe2ea" stroke-width="2" />
  <text class="t frame" x="64" y="142">Compiler</text>

  <!-- Front-end: everything that reads the source language. The row sits 44px inside the
       frame rather than the usual 20 so the entering arrow, centred on the first box, clears
       the "Front-End" label instead of running through it. -->
  <rect class="group" x="64" y="168" width="1024" height="200" rx="18" />
  <text class="t side" x="84" y="200">Front-End</text>

  <rect class="box" x="108" y="226" width="175" height="95" rx="14" />
  <text class="t step" x="195.5" y="268" text-anchor="middle">Lexical Analyzer</text>
  <text class="t sub"  x="195.5" y="291" text-anchor="middle">(Scanner)</text>

  <path class="flow" d="M284,273 H353" />
  <text class="t edge" x="326.5" y="262" text-anchor="middle">tokens</text>

  <rect class="box" x="370" y="226" width="175" height="95" rx="14" />
  <text class="t step" x="457.5" y="268" text-anchor="middle">Syntax Analyzer</text>
  <text class="t sub"  x="457.5" y="291" text-anchor="middle">(Parser)</text>

  <path class="flow" d="M546,273 H614" />
  <text class="t edge" x="588" y="262" text-anchor="middle">parse tree</text>

  <rect class="box" x="631" y="226" width="175" height="95" rx="14" />
  <text class="t step" x="718.5" y="280" text-anchor="middle">Semantic Analyzer</text>

  <path class="flow" d="M807,273 H876" />
  <text class="t edge" x="849.5" y="262" text-anchor="middle">symbol tables</text>

  <rect class="box" x="893" y="226" width="175" height="95" rx="14" />
  <text class="t step" x="980.5" y="280" text-anchor="middle">AST Builder</text>

  <!-- The AST is the interface between the two halves: this arrow leaves the AST builder,
       crosses the front-end frame and stops just short of the back-end one. -->
  <path class="flow" d="M1069,273 H1162" />
  <text class="t ir" x="1123.5" y="262" text-anchor="middle">IR<title>intermediate representation: the abstract syntax tree</title></text>

  <!-- Back-end: everything that writes the target language -->
  <rect class="group" x="1180" y="168" width="256" height="200" rx="18" />
  <text class="t side" x="1200" y="200">Back-End</text>

  <rect class="box" x="1200" y="226" width="216" height="95" rx="14" />
  <text class="t step" x="1308" y="268" text-anchor="middle">Code Generator</text>
  <text class="t sub"  x="1308" y="291" text-anchor="middle">(MIPS assembly)</text>

  <!-- Drawn last, over the compiler and front-end frames they cross: painted in place
       the containers would cover them, and the entering arrow would lose its head. -->
  <path class="flow" d="M195.5,64 V209" />
  <path class="flow" d="M1308,225 V80" />
</svg>
