# As respostas de compilacao carregam grafos renderizados. O SVG da arvore de
# derivacao passa de ~196 KB para ~27 KB comprimido, entao vale habilitar gzip.
server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/css,application/javascript,image/svg+xml
server.compression.min-response-size=2KB
